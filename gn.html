<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #fff;
    }

    /* Password screen */
    #lockScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 15px;
    }

    input {
      padding: 10px;
      font-size: 18px;
      border-radius: 5px;
      border: none;
      text-align: center;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 5px;
      border: none;
    }

    /* Main button (hidden until unlocked) */
    #mainContent {
      display: none;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      color: #ffffff;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.3s;
    }

    .button:hover {
      background-color: #4a148c;
    }

    #error {
      color: red;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <!-- LOCK SCREEN -->
  <div id="lockScreen">
    <h1>i like cheese (not stolen code trust)</h1>
    <p>type the password gng (password is fgfgfgfg cause this site is still niche)</p>
    <input type="password" id="passwordInput" placeholder="••••">
    <button onclick="unlock()">Unlock</button>
    <div id="error"></div>
  </div>

  <!-- MAIN CONTENT -->
  <div id="mainContent">
    <a id="button" class="button">this is the button for gn math i think</a>
  </div>

  <script>
    const PASSWORD = "fgfgfgfg"; // change this if you want

    function unlock() {
      const input = document.getElementById("passwordInput").value;
      const error = document.getElementById("error");

      if (input === PASSWORD) {
        document.getElementById("lockScreen").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
      } else {
        error.textContent = "imagine typing the wrong password lmao";
      }
    }

    document.getElementById("button")?.addEventListener("click", launch);

    function launch() {
      try {
        fetch("https://cdn.jsdelivr.net/gh/gn-math/gn-math-DONTDMCA@main/singlefile.html?t=" + Date.now())
          .then(response => response.text())
          .then(text => {
            const newWin = window.open("about:blank", "_blank");
            if (newWin) {
              newWin.document.open();
              newWin.document.write(text);
              newWin.document.close();
            }
          });
      } catch (error) {
        console.error("error:", error);
      }
    }
  </script>

</body>
</html>
